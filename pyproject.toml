[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ga4-realtime"
# Static on purpose: this is the single source of truth for the version, and
# ga4_realtime.__version__ reads it back with importlib.metadata rather than
# declaring it a second time where the two could drift apart.
version = "0.1.0"
description = "Poll the GA4 Realtime API on a schedule and render a live \"today so far\" terminal dashboard from the accumulated history"
readme = "README.md"
# 3.11 rather than 3.10: tomllib entered the stdlib in 3.11, and the config
# format is TOML precisely so that parsing it costs no dependency.
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Fabiano Chamone" }]
keywords = [
    "ga4",
    "google-analytics",
    "realtime",
    "analytics",
    "dashboard",
    "terminal",
    "tui",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: Log Analysis",
    "Topic :: System :: Monitoring",
]

# Five runtime dependencies, and the count staying at five is a feature --
# adding a sixth is an "ask first" decision. The lower bounds are the versions
# the tool is actually developed and run against (constraints.txt pins the
# whole tree at those exact versions); nothing older has ever been tried, so
# claiming a looser floor would be a guess dressed as a promise.
dependencies = [
    "google-analytics-data>=0.23.0",   # the Realtime report itself
    "google-analytics-admin>=0.30.1",  # property display name and timezone
    "rich>=15.0.0",                    # terminal layout and the Live region
    "plotext>=5.3.2",                  # the chart, drawn in terminal cells
    # Windows ships no IANA timezone database at all, so without this
    # ZoneInfo("America/Sao_Paulo") raises ZoneInfoNotFoundError -- and every
    # day boundary in the tool is computed in the property's own timezone.
    # A hard requirement, not a convenience.
    "tzdata>=2026.3",
    "python-dotenv>=1.2.2",            # reads .env, for secrets only
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
# The console script replaces the old "#!.venv\Scripts\python.exe" shebang: it
# is generated by the packaging metadata and works identically on Linux, macOS
# and Windows, from any working directory, with no venv activation.
ga4-realtime = "ga4_realtime.cli:main"

[project.urls]
Homepage = "https://github.com/fchamone/ga4_realtime"
Repository = "https://github.com/fchamone/ga4_realtime"
Issues = "https://github.com/fchamone/ga4_realtime/issues"

# Stated explicitly rather than left to hatchling's auto-detection: the
# distribution is "ga4-realtime" and the import package is "ga4_realtime", and
# an explicit line is cheaper than remembering that the backend normalises the
# hyphen for you.
[tool.hatch.build.targets.wheel]
packages = ["src/ga4_realtime"]

[tool.ruff]
# 79, not ruff's 88 default. It matches the single file this package was ported
# from, so moving a function between modules does not reflow every line it
# touches and bury the port in whitespace noise.
line-length = 79

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib import mode keeps the repo root off sys.path, so tests import the
# *installed* package rather than the working copy that happens to sit beside
# them. That is the whole point of the src/ layout: a suite that passes here
# and fails for anyone installing the wheel is the failure it prevents.
addopts = "--import-mode=importlib"
